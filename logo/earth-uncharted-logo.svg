      <stop offset="0%" stop-color="#3b4fd8"/>
      <stop offset="55%" stop-color="#2a2f9e"/>
      <stop offset="100%" stop-color="#1a1660"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d6e2ff"/>
